version: '3.9'

services:
 
  user-service:
    image: bbslama/springboot-app:latest
    ports:
      - "8081:8081"
    depends_on:
      - springboot-pg
 

  springboot-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: dockerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
 
 