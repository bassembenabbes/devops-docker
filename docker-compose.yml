version: '3.9'

services:
  # Spring Boot Backend
  user-service:
    image: bbslama/springboot-app:latest
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://springboot-pg:5432/dockerdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      springboot-pg:
        condition: service_healthy # Wait for DB to be ready

  # Angular Frontend
  frontend:
    image: bbslama/frontend-app:latest
    ports:
      - "4200:4200"
    depends_on:
      - user-service

  # Database
  springboot-pg:
    image: postgres:16
    environment:
      POSTGRES_DB: dockerdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dockerdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

 